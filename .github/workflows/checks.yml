name: Data and dashboard checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install the tested dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare and reconcile the source snapshot
        run: python prepare_data.py
      - name: Check the data and dashboard interactions
        run: python -m pytest -q
